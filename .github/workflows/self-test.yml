name: Controller checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: controller-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified public tools
        run: python3 install_tools.py
      - name: Check workflow syntax
        run: actionlint -color
      - name: Test scheduling and report privacy
        run: python3 -B -m unittest -v
  isolation-canary:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified public tools
        env:
          CI_NATIVE_TOOLS: ${{ runner.os == 'macOS' }}
        run: python3 install_tools.py
      - name: Verify isolation using public fixtures only
        run: python3 isolation_canary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: isolation-canary-${{ runner.os }}
          path: ${{ runner.temp }}/ci-private/evidence
          retention-days: 3
          if-no-files-found: warn
